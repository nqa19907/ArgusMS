[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fallguard"
version = "0.1.0"
description = "MVP Backend giám sát người cao tuổi bị ngã bằng Computer Vision"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "firebase-admin>=6.5.0",
    "httpx>=0.27.0",
    "pytest>=8.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "training*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]